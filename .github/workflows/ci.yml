name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenSSH server
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server
      - name: cargo test
        run: cargo test --locked
        env:
          # Linux runs the real sshd login test and fails if it can't.
          # macOS's sshd isn't usable unprivileged, so skip it there.
          GK_REQUIRE_SSH_E2E: ${{ runner.os == 'Linux' && '1' || '' }}
          GK_SKIP_SSH_E2E: ${{ runner.os == 'macOS' && '1' || '' }}

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
        env:
          GK_SKIP_SSH_E2E: "1"

  demo:
    name: end-to-end demo script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: scripts/dev.sh demo
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          scripts/dev.sh demo
