[package]
name = "gk"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Git-native, policy-as-code SSH access management"
license = "BSD-3-Clause"
repository = "https://github.com/biscuitrescue/gatekeep"

[lib]
name = "gatekeep"
path = "src/lib.rs"

[[bin]]
name = "gk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = { version = "3.4", features = ["termination"] }
hostname = "0.4"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

[profile.release]
strip = true
lto = true
